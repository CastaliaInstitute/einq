# Publish static site from docs/ plus OTA firmware manifest/binary when available.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "firmware/einq-version"
      - "README.md"
      - "scripts/bundle-pages-site.sh"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A release-tag workflow deploys the exact firmware it just built. Do
      # not race it with a site-only deployment for the same commit: GitHub
      # Pages identifies both deployments by SHA and may retain the first
      # artifact even when the second reports success.
      - name: Detect release-tagged commit
        id: release_tag
        shell: bash
        run: |
          tagged=false
          for attempt in {1..6}; do
            if git ls-remote --tags origin | awk -v sha="$GITHUB_SHA" '$1 == sha { found=1 } END { exit !found }'; then
              tagged=true
              break
            fi
            sleep 5
          done
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"

      - name: Bundle site + firmware
        if: steps.release_tag.outputs.tagged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/bundle-pages-site.sh
          bash scripts/bundle-pages-site.sh _pages

      - uses: actions/configure-pages@v5
        if: steps.release_tag.outputs.tagged != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release_tag.outputs.tagged != 'true'
        with:
          path: _pages
      - uses: actions/deploy-pages@v4
        if: steps.release_tag.outputs.tagged != 'true'
        id: deployment
